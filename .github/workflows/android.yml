name: Android CI – Build & Release MVVM/MVI

permissions:
  contents: write

on:
  push:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavorDir: weatherMvvm
            flavorGradle: WeatherMvvm
          - flavorDir: weatherMvi
            flavorGradle: WeatherMvi

    steps:
      - name: 체크아웃 (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: JDK 17 셋업 (Setup Java 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 키스토어 디코드 (Decode Keystore)
        run: |
          echo "${{ secrets.KEYSTORE_BASE_64 }}" \
            | base64 --decode > app/release.keystore
        env:
          KEYSTORE_BASE_64: ${{ secrets.KEYSTORE_BASE_64 }}

      - name: gradlew 실행권한 부여 (Grant Execute)
        run: chmod +x gradlew

      - name: AAB 빌드 – flavor=${{ matrix.flavorGradle }} (Build AAB)
        run: ./gradlew :app:bundle${{ matrix.flavorGradle }}Release --parallel
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS:      ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.KEY_PASSWORD }}

      - name: AAB artifact 업로드 (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: aab-${{ matrix.flavorDir }}
          path: app/build/outputs/bundle/${{ matrix.flavorDir }}Release/*.aab

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: MVVM AAB 다운로드 (Download MVVM Artifact)
        uses: actions/download-artifact@v4
        with:
          name: aab-weatherMvvm
          path: artifacts/weatherMvvm

      - name: MVI AAB 다운로드 (Download MVI Artifact)
        uses: actions/download-artifact@v4
        with:
          name: aab-weatherMvi
          path: artifacts/weatherMvi

      - name: 버전 추출 (Extract Version)
        id: extract_version
        run: |
          subject=$(head -n1 <<< "${{ github.event.head_commit.message }}")
          version=$(grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' <<< "$subject")
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: 릴리즈 존재 여부 확인 (Check Release Exists)
        id: check_release
        uses: insightsengineering/release-existence-action@v1
        with:
          release-tag: ${{ steps.extract_version.outputs.version }}

      - name: 새 릴리즈 생성 및 URL 확보 (Create Release)
        if: steps.check_release.outputs.release-exists == 'false'
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name:     ${{ steps.extract_version.outputs.version }}
          release_name: ${{ steps.extract_version.outputs.version }}
          body:         ${{ github.event.head_commit.message }}

      - name: 기존 릴리즈 upload_url 조회 (Get Existing Release URL)
        if: steps.check_release.outputs.release-exists == 'true'
        id: get_url
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            const tag = '${{ steps.extract_version.outputs.version }}';
            const rel = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              tag:   tag
            });
            return rel.data.upload_url;

      - name: MVVM AAB 릴리즈에 첨부 (Upload MVVM AAB)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url || steps.get_url.outputs.result }}
          asset_path: artifacts/weatherMvvm/*.aab
          asset_name: weather-mvvm-release.aab
          asset_content_type: application/vnd.android.package-archive

      - name: MVI AAB 릴리즈에 첨부 (Upload MVI AAB)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url || steps.get_url.outputs.result }}
          asset_path: artifacts/weatherMvi/*.aab
          asset_name: weather-mvi-release.aab
          asset_content_type: application/vnd.android.package-archive
