name: Android CI

permissions:
  contents: write

on:
  push:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [WeatherMvvm, WeatherMvi]

    steps:
      - name: 체크아웃 (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 셋업 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 디코드 Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE_64 }}" \
            | base64 --decode > app/release.keystore
        env:
          KEYSTORE_BASE_64: ${{ secrets.KEYSTORE_BASE_64 }}

      - name: Gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: AAB 빌드 (flavor=${{ matrix.flavor }})
        run: ./gradlew :app:bundle${{ matrix.flavor }}Release --parallel
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS:      ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.KEY_PASSWORD }}

      - name: 빌드 결과 저장 (artifact)
        uses: actions/upload-artifact@v3
        with:
          name: aab-${{ matrix.flavor }}
          path: app/build/outputs/bundle/${{ matrix.flavor | downcase }}Release/*.aab

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: 다운로드 MVVM AAB
        uses: actions/download-artifact@v3
        with:
          name: aab-WeatherMvvm
          path: artifacts

      - name: 다운로드 MVI AAB
        uses: actions/download-artifact@v3
        with:
          name: aab-WeatherMvi
          path: artifacts

      - name: Extract version
        id: extract_version
        run: |
          subject=$(head -n1 <<< "${{ github.event.head_commit.message }}")
          version=$(grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' <<< "$subject")
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Check if release exists
        id: check_release
        uses: insightsengineering/release-existence-action@v1
        with:
          release-tag: ${{ steps.extract_version.outputs.version }}

      - name: Create GitHub Release
        if: steps.check_release.outputs.release-exists == 'false'
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name:     ${{ steps.extract_version.outputs.version }}
          release_name: ${{ steps.extract_version.outputs.version }}
          body:         ${{ github.event.head_commit.message }}

      - name: Get existing release ID
        if: steps.check_release.outputs.release-exists == 'true'
        id: get_release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            const tag = '${{ steps.extract_version.outputs.version }}';
            const rel = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              tag:   tag
            });
            return rel.data.id;

      - name: Upload all AABs to Release
        uses: dwenegar/upload-release-assets@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_id:  ${{ steps.create_release.outputs.id || steps.get_release.outputs.result }}
          assets_path: 'artifacts/*.aab'
