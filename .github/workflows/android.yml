name: Android CI

permissions:
  contents: write
  
on:
  push:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false 
      matrix:
        flavor: [WeatherMvvm, WeatherMvi]

    steps:
    - name: 체크아웃 (Checkout)
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        
    - name: 셋업 JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: 디코드 Keystore
      run: |
        echo "$KEYSTORE_BASE_64" | base64 --decode > app/release.keystore
      env:
        KEYSTORE_BASE_64: ${{ secrets.KEYSTORE_BASE_64 }}
      
    - name: Gradlew에 대한 실행 권한 부여
      run: chmod +x gradlew
      
    - name: app 빌드
      run: ./gradlew :app:bundle${{ matrix.flavor }}Release --parallel
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        
    - name: 빌드 결과 찍어보기
      run: |
        echo "=== BUNDLE 폴더 리스트 ==="
        ls -R app/build/outputs/bundle
        
    - name: commit 메시지에서 버전 추출(제목에서 x.y.z 부분만)
      id: extract_version
      run: |
          subject=$(echo '${{ github.event.head_commit.message }}' | head -n 1)
          version=$(echo "$subject" | grep -E -o '[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}')
          echo "version=$version" >> $GITHUB_OUTPUT
          
    - name: Check if release exists
      id: check_release
      uses: insightsengineering/release-existence-action@v1
      with:
        release-tag: ${{ steps.extract_version.outputs.version }}


    - name: Create GitHub Release
      if: steps.check_release.outputs.release-exists == 'false'
      id: create_release
      uses: actions/create-release@v1
      with:
        tag_name: ${{ steps.extract_version.outputs.version }}
        release_name: ${{ steps.extract_version.outputs.version }}
        body: ${{ github.event.head_commit.message }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
    - name: Get existing release ID
      if: steps.check_release.outputs.release-exists == 'true'
      id: get_release
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const tag = '${{ steps.extract_version.outputs.version }}';
           const release = await github.rest.repos.getReleaseByTag({
             owner: context.repo.owner,
             repo:  context.repo.repo,
             tag:   tag
             });
          return release.data.id;
      result-encoding: string

    - name: Upload all AABs to Release
      uses: dwenegar/upload-release-assets@v1
       with:
       release_id: ${{ steps.create_release.outputs.id || steps.get_release.outputs.result }}
       assets_path: '["app/build/outputs/bundle/*/release/*.aab"]'
       env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

