name: Android CI

permissions:
  contents: write
  
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: 셋업 JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: 디코드 Keystore
      run: |
        echo "$KEYSTORE_BASE_64" | base64 --decode > app/release.keystore
      env:
        KEYSTORE_BASE_64: ${{ secrets.KEYSTORE_BASE_64 }}
      
    - name: Gradlew에 대한 실행 권한 부여
      run: chmod +x gradlew

    - name: 유닛테스트 실행
      run: ./gradlew test
      
    - name: app 빌드
      run: ./gradlew :app:assembleRelease
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: commit 메시지에서 버전 추출(제목에서 x.y.z 부분만)
      id: extract_version
      run: |
          subject=$(echo '${{ github.event.head_commit.message }}' | head -n 1)
          version=$(echo "$subject" | egrep -o '[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}')
          echo "version=$version" >> $GITHUB_OUTPUT

    - name: Release 노트 생성
      uses: actions/create-release@v1
      if: github.event_name == 'push'
      id: create_release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.extract_version.outputs.version }}
        release_name: ${{ steps.extract_version.outputs.version }}
        body: ${{ github.event.head_commit.message }}

    - name: APK 파일 릴리즈에 첨부
      if: github.event_name == 'push'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./app/build/outputs/apk/weather/release/app-weather-release.apk
        asset_name: app-debug.apk
        asset_content_type: application/vnd.android.package-archive
