name: Android CI

permissions:
  contents: write
  
on:
  push:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false 
      matrix:
        flavor: [WeatherMvvm, WeatherMvi]

    steps:
    - name: 체크아웃 (Checkout)
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        
    - name: 셋업 JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: 디코드 Keystore
      run: |
        echo "$KEYSTORE_BASE_64" | base64 --decode > app/release.keystore
      env:
        KEYSTORE_BASE_64: ${{ secrets.KEYSTORE_BASE_64 }}
      
    - name: Gradlew에 대한 실행 권한 부여
      run: chmod +x gradlew
      
    - name: app 빌드
      run: ./gradlew :app:bundle${{ matrix.flavor }}Release --parallel
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    - name: 빌드 결과 찍어보기
      run: |
        echo "=== BUNDLE 폴더 리스트 ==="
        ls -R app/build/outputs/bundle
    - name: commit 메시지에서 버전 추출(제목에서 x.y.z 부분만)
      id: extract_version
      run: |
          subject=$(echo '${{ github.event.head_commit.message }}' | head -n 1)
          version=$(echo "$subject" | grep -E -o '[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}')
          echo "version=$version" >> $GITHUB_OUTPUT

    - name: Release 노트 생성
      uses: actions/create-release@v1
      if: github.event_name == 'push'
      id: create_release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.extract_version.outputs.version }}
        release_name: ${{ steps.extract_version.outputs.version }}
        body: ${{ github.event.head_commit.message }}

    - name: MVVM AAB 업로드
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: app/build/outputs/bundle/weatherMvvmRelease/app-weather-mvvm-release.aab
        asset_name: app-weather-mvvm-release.aab
        asset_content_type: application/vnd.android.package-archive

    - name: MVI AAB 업로드
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: app/build/outputs/bundle/weatherMviRelease/app-weather-mvi-release.aab
        asset_name: app-weather-mvi-release.aab
        asset_content_type: application/vnd.android.package-archive


