name: CI - Unit Tests

on:
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃 (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 셋업 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Gradlew에 대한 실행 권한 부여
        run: chmod +x gradlew

      - name: 유닛테스트 실행
        run: ./gradlew test --parallel
