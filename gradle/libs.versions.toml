[versions]
#apps
#libs
agp = "8.9.1"
kotlin = "2.2.0"
coreKtx = "1.13.1"
junit = "4.13.2"
#material3 = "1.3.0"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
lifecycleRuntimeKtx = "2.8.6"
activityCompose = "1.9.2"
composeBom = "2025.06.01"
glide = "1.0.0-beta01"
hilt_navigation_compose = "1.2.0"
hilt = "2.56.2"
naver_map_compose = "1.8.2"
naver_map_location = "21.0.2"
google-service = "4.4.2"
firebase-bom = "33.16.0"
firebase-crashlytics-plugin = "3.0.4"
retrofit = "3.0.0"
okhttp = "5.0.0"
mockk = "1.14.4"
coroutines = "1.10.2"
core-testing = "2.2.0"
turbine = "1.2.1"
logger= "2.2.0"
gson = "2.13.1"
google-location = "21.3.0"
compose-ui-util = "1.8.3"
accompanist-permissions = "0.37.3"
appcompat = "1.7.1"
material = "1.12.0"
jetbrainsKotlinJvm = "2.0.20"
ksp = "2.2.0-2.0.2"
kotlinx-coroutines-core = "1.7.3"
lifecycle-viewmodel-ktx = "2.9.1"
uiautomator = "2.3.0"
benchmarkMacroJunit4 = "1.3.4"
compose = "1.8.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group="androidx.compose.ui", name="ui-tooling", version.ref="compose" }
androidx-ui-tooling-preview = { group="androidx.compose.ui", name="ui-tooling-preview", version.ref="compose" }
androidx-ui-test-manifest = { group="androidx.compose.ui", name="ui-test-manifest", version.ref="compose" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
#Glide
glide = { module = "com.github.bumptech.glide:compose", version.ref = "glide" }
#hilt
hilt = {group = "com.google.dagger", name  = "hilt-android", version.ref = "hilt"}
hilt_compiler = {group = "com.google.dagger", name  = "hilt-android-compiler", version.ref = "hilt"}
hilt_navigation_compose = {module = "androidx.hilt:hilt-navigation-compose", version.ref = "hilt_navigation_compose" }
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }
#navermap
naver-map-compose = {group = "io.github.fornewid", name  = "naver-map-compose", version.ref = "naver_map_compose" }
naver-map-location = {group = "io.github.fornewid", name  = "naver-map-location", version.ref = "naver_map_location" }
#firebase
firebase-bom = {group = "com.google.firebase", name  = "firebase-bom", version.ref ="firebase-bom" }
firebase-crashlytics = { group = "com.google.firebase", name  = "firebase-crashlytics" }
firebase-analytics = { group = "com.google.firebase", name  = "firebase-analytics" }
#retrofit
retrofit = {group = "com.squareup.retrofit2", name  = "retrofit", version.ref = "retrofit"}
converter-gson = {group = "com.squareup.retrofit2", name  = "converter-gson", version.ref = "retrofit"}
#okhttp
okhttp = {module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp"}
logging-interceptor = {module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp"}
#mockk
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
#testcode
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
core-testing = { module = "androidx.arch.core:core-testing", version.ref = "core-testing" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
#logger
logger = { module = "com.orhanobut:logger", version.ref = "logger"}
#gson
gson = { module = "com.google.code.gson:gson", version.ref = "gson"}
#google-location
google-location = {module = "com.google.android.gms:play-services-location",version.ref = "google-location"}
compose-ui-util = {module = "androidx.compose.ui:ui-util",version.ref = "compose-ui-util"}
#accompanist-permissions
accompanist-permissions = {module = "com.google.accompanist:accompanist-permissions",version.ref = "accompanist-permissions"}
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
#coroutines core
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core" , version.ref ="kotlinx-coroutines-core"}
#lifecycle-viewmodel-ktx
lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx" , version.ref ="lifecycle-viewmodel-ktx"}
androidx-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmarkMacroJunit4" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
google-service = {id = "com.google.gms.google-services", version.ref = "google-service"}
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = {id = "com.google.dagger.hilt.android", version.ref = "hilt"}
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebase-crashlytics-plugin" }
android-library = { id = "com.android.library", version.ref = "agp" }
jetbrains-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "jetbrainsKotlinJvm" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
android-test = { id = "com.android.test", version.ref = "agp" }

[bundles]
androidx-core-lifecycle = [
    "androidx-core-ktx",
    "androidx-lifecycle-runtime-ktx"
]
androidx-ui = [
    "androidx-ui",
    "androidx-ui-graphics",
    "androidx-ui-tooling-preview",
    "androidx-material3",
    "compose-ui-util"
]
hilt = [
    "hilt",
    "hilt_navigation_compose"
]
naver-map = [
    "naver-map-compose",
    "naver-map-location"
]
firebase = [
    "firebase-crashlytics",
    "firebase-analytics"
]
networking = [
    "retrofit",
    "converter-gson",
    "okhttp",
    "logging-interceptor"
]
testing = [
    "junit",
    "mockk",
    "coroutines-test",
    "core-testing",
    "turbine"
]
androidx-ui-test = [
    "androidx-ui-test-junit4",
    "androidx-espresso-core",
    "androidx-junit"
]
debug-test = [
    "androidx-ui-tooling",
    "androidx-ui-tooling-preview",
    "androidx-ui-test-manifest"
]
